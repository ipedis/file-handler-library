services:
  # S3-compatible server for the demo (MinIO community images are no longer published)
  s3:
    image: motoserver/moto:5.2.5
    ports:
      - "5000:5000"
    networks:
      - file-handler-demo

  handler-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: handler-app
    env_file: demo/.env
    networks:
      - file-handler-demo
    depends_on:
      - s3
    volumes:
      - "./:/app"

networks:
  file-handler-demo:
    driver: bridge
