#!/bin/bash
services:
  minio:
    image: quay.io/minio/minio
    volumes:
      - "minio_data:/data"
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: 'user'
      MINIO_ROOT_PASSWORD: 'password'
      MINIO_ADDRESS: ':9000'
      MINIO_CONSOLE_ADDRESS: ':9001'
    command: [ "minio", "server", "/data" ]
    networks:
      - file-handler-demo

  handler-app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: handler-app
    ports:
      - "8000:8000"
    command: [ "dev" ]
    networks:
      - file-handler-demo
    restart: unless-stopped
    depends_on:
      - minio
    volumes:
      - "./:/app"

networks:
    file-handler-demo:
        driver: bridge
volumes:
  minio_data: