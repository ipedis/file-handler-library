[tool.poetry]
name = "file-handler-library"
version = "0.1.0"
description = "Python package to handle file operations."
authors = ["Tejas <tejas@ipedis.com>"]
readme = "README.md"
packages = [{include = "file_handler_library"}]

[tool.poetry.dependencies]
python = ">=3.10, <3.12"
pydantic = "^2.10.6"
filelock = "^3.17.0"
itsdangerous = "^2.2.0"
xattr = "^1.1.4"
boto3 = "^1.37.2"
poetry-audit-plugin = "^0.4.0"
pydantic-settings = "^2.8.1"
pytest = "^8.3.5"
pytest-env = "^1.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-mock = "^3.14.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
