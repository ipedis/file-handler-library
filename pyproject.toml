[project]
name = "file-handler-library"
version = "2.0.0"
description = "Python package to handle file operations."
authors = [{ name = "Tejas", email = "tejas@ipedis.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2",
    "pip-audit>=2.10",
    "pytest>=9.0.3",
    "pytest-mock>=3.15",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["file_handler_library"]
